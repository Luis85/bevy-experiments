[package]
name = "island_content"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Island Village content: the living_world island simulation (residents, economy, colony, terrain), its construction and scenario."

[dependencies]
# Content depends on the framework only through the facade (arch_fitness);
# the bevy_* sub-crates are the engine crates its derives expand to. Every
# capability the island uses is on.
npc_framework = { workspace = true, features = [
    "locomotion",
    "nav",
    "perception",
    "rules",
    "agent-io",
    "interaction",
    "command",
    "vehicles",
    "progression",
    "crafting",
] }
bevy_ecs.workspace = true
bevy_app.workspace = true
bevy_reflect.workspace = true
serde.workspace = true
serde_json = "1"

[dev-dependencies]
bevy_ecs.workspace = true
