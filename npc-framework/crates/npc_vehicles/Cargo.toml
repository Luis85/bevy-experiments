[package]
name = "npc_vehicles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Opt-in vehicles for the NPC framework: seats with roles, mount/dismount verbs, crew following the vehicle, ByCrew (driven by its driver) and Direct (a unit of its own) control."

[dependencies]
bevy_ecs.workspace = true
bevy_app.workspace = true
bevy_reflect.workspace = true
npc_ai.workspace = true
npc_kernel.workspace = true
npc_locomotion.workspace = true
# ADR 0012: the one capability this crate may depend on (its own verbs).
npc_interaction.workspace = true
serde.workspace = true
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
npc_jobs.workspace = true
npc_nav.workspace = true
