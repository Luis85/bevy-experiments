[package]
name = "horde_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }

[features]
# Test-only `*_mut` accessors on `Game`/`ParallelBattle`. Never enabled by a
# production build: this crate's own integration tests turn it on through the
# self dev-dependency below, and `horde-defense` only as a dev-dependency.
test-support = []
# The review/test-only stress seam: `STRESS_ENEMY_CAP`, the stress fixtures and
# `Attempt::stage_review_enemy_cap`. Enabled only through `horde-defense`'s
# `review` feature; playtest builds (`--no-default-features`) compile without it.
review = []

[dev-dependencies]
horde_core = { path = ".", features = ["test-support"] }

# The save-clone benchmark's fixture and report tests run under `cargo test`.
[[example]]
name = "save_clone"
test = true
