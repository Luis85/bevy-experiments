[package]
name = "horde_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }

[features]
# Test-only `*_mut` accessors on `Game`/`ParallelBattle`. Never enabled by a
# production build: this crate's own integration tests turn it on through the
# self dev-dependency below, and `horde-defense` only as a dev-dependency.
test-support = []

[dev-dependencies]
horde_core = { path = ".", features = ["test-support"] }
