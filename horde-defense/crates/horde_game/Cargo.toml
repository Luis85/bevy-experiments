[package]
name = "horde-defense"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
horde_core = { path = "../horde_core" }
# No picking: the frontend is egui-only and never uses Bevy pointer picking, so
# both Bevy's picking plugins and bevy_egui's picking integration are left out.
bevy = { version = "=0.20.0", default-features = false, features = ["default_app", "std", "multi_threaded", "bevy_winit", "x11", "default_font", "2d_bevy_render", "bevy_audio", "wav", "png"] }
bevy_egui = { version = "=0.43.1", default-features = false, features = ["manage_clipboard", "open_url", "default_fonts", "render", "bevy_ui"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Tests stage state through the core's test-only mutators; production builds
# (default, `--no-default-features`, `--features dev`) never get them.
horde_core = { path = "../horde_core", features = ["test-support"] }

[features]
default = ["review"]
# Isolated review tooling: model workshop, review fixtures and screens, capture
# sequence, automated screenshots and performance reports. Playtest packages
# build without it (`--no-default-features`).
review = []
# Developer conveniences: asset hot reload, change-location tracking and system
# information diagnostics. (`bevy_dev_tools` is left out: no release matches the
# locked `bevy_internal` 0.20.1.)
dev = ["bevy/file_watcher", "bevy/track_location", "bevy/sysinfo_plugin"]
