[package]
name = "horde-defense"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
horde_core = { path = "../horde_core" }
bevy = { version = "=0.20.0", default-features = false, features = ["default_app", "std", "multi_threaded", "bevy_winit", "x11", "default_font", "2d_bevy_render", "bevy_audio", "wav", "png", "bevy_picking"] }
bevy_egui = "=0.43.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"


