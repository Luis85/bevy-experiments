[workspace]
members = ["crates/horde_core", "crates/horde_audio", "crates/horde_game"]
default-members = ["crates/horde_game"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
version = "0.1.0"
license = "MIT"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

# Optimised build with line tables so crash backtraces stay readable.
[profile.playtest]
inherits = "release"
debug = "line-tables-only"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
