[package]
name = "terra-net"
version = "0.1.0"
edition = "2024"
description = "Bounded authoritative multiplayer reference for Terra World"
license = "MIT OR Apache-2.0"

[features]
default = ["reference-server"]
reference-server = ["dep:terra-stream", "dep:terra-history", "dep:ctrlc"]

[dependencies]
terra-core = { path = "../terra-core" }
terra-sandbox = { path = "../terra-sandbox" }
terra-stream = { path = "../terra-stream", optional = true }
terra-history = { path = "../terra-history", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
getrandom = "0.4"
tempfile = "3"
ctrlc = { version = "3.5", optional = true }

[[bin]]
name = "terra-server"
path = "src/bin/server.rs"
required-features = ["reference-server"]

[[bin]]
name = "terra-client"
path = "src/bin/client.rs"
