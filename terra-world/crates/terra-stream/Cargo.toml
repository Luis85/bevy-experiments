[package]
name = "terra-stream"
version.workspace = true
edition = "2024"
description = "Bounded world chunk streaming and explicitly attributed open-data adapters"
license = "MIT OR Apache-2.0"

[dependencies]
terra-core = { path = "../terra-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[lints.rust]
unsafe_code = "forbid"
