[package]
name = "terra-history"
version.workspace = true
edition = "2024"
description = "Time-bounded world packs and geopolitical boundary data for Terra World"
license = "MIT OR Apache-2.0"

[dependencies]
terra-core = { path = "../terra-core" }
serde = { version = "1", features = ["derive"] }
