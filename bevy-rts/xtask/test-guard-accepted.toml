# Test-guard findings a reviewer has accepted (ruling M16, R154). `cargo xtask gate` and `cargo xtask test-guard` drop
# the findings an entry accepts; the rest are reported. An entry's key is file, test (the enclosing function), kind and
# the whole normalized text of the finding; the line number is ignored. `count` (default 1) is how many identical
# findings were accepted: if more than `count` match, all of them are reported again. The text and test are copied from
# `cargo xtask test-guard` output. Every entry names its ruling; `note` names the M1 task review that accepted it,
# where the M1 ledger says so.
# Protected (OWNERS.toml): only the lead adds entries, after a reviewer accepts a finding.
#
# Seed: R154 batch-accepts every finding of `cargo xtask test-guard --base m0` at tag m1 as reviewed at M1 close.

