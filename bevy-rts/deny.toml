# cargo-deny policy (spec §12.2, ADR-0009). `cargo xtask gate pr` runs `cargo deny check`.

[graph]
all-features = false

[advisories]
# The default RustSec advisory database. Every ignore names its upstream path and when to revisit it.
ignore = [
    { id = "RUSTSEC-2026-0344", reason = "ruzstd 0.8 (decompression bomb) decodes KTX2 in bevy_image: only Bevy's embedded, trusted LUT KTX2 files are decoded; no untrusted KTX2 is loaded (M0 uses primitives). No fixed version is semver-compatible with bevy 0.20 / bevy_egui 0.43. Revisit on the next bevy upgrade (ruling R29)." },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser (unmaintained) comes only through winit's sctk-adwaita window decorations on Linux; no replacement upstream yet. Revisit on the next bevy upgrade." },
]

[licenses]
# Permissive licences only: never NC, ND, SA or the GPL family.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "MIT-0",
    "BSL-1.0",
]
confidence-threshold = 0.8
# MPL-2.0 is pre-approved but not in the tree yet.
unused-allowed-license = "allow"
# Font licences for the egui default fonts only (OFL is a font licence, not a code copyleft).
exceptions = [
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

[licenses.private]
# Workspace crates are not published.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"
deny = [
    { crate = "bincode", reason = "postcard is the only binary format (spec §5.5)" },
    { crate = "bevy_dynamic_plugin", reason = "no dynamic plugins (spec §3)" },
    # Multiple versions of any Bevy crate fail: one entry per bevy* crate in Cargo.lock.
