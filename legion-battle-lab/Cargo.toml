[workspace]
members = ["crates/battle_core", "crates/legion"]
default-members = ["crates/legion"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1
debug = 0
codegen-units = 1

[profile.dev.package."*"]
opt-level = 1

[profile.dev.build-override]
opt-level = 0
codegen-units = 1

[profile.release]
lto = "thin"
codegen-units = 16
strip = "debuginfo"

