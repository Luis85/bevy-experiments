[package]
name = "legion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A native Bevy battle sandbox with a compact reference simulation"

[dependencies]
battle_core = { path = "../battle_core" }
serde.workspace = true
serde_json.workspace = true
bytemuck = { version = "1", features = ["derive"] }
bevy = { version = "=0.20.0", default-features = false, features = [
    "default_app", "std", "multi_threaded", "bevy_winit", "x11", "default_font",
    "3d_bevy_render", "ui_bevy_render", "bevy_ui_widgets", "bevy_input_focus",
    "bevy_picking", "ui_picking"
] }

